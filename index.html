<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#b91c1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pompiers">
  <title>Pompiers Louiseville</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">SERVICE INCENDIE</div>
      <h1>Louiseville</h1>
    </div>
    <button id="installBtn" class="icon-btn hidden" aria-label="Installer l’application">＋</button>
  </header>

  <main>
    <section class="hero-card">
      <div>
        <span class="status-dot"></span>
        <strong>Application opérationnelle</strong>
        <p>Adresses officielles, GPS et bornes-fontaines.</p>
      </div>
      <button id="locateBtn" class="secondary-btn">Ma position</button>
    </section>

    <section class="search-section">
      <label for="addressSearch">Adresse d’intervention</label>
      <div class="search-row">
        <input id="addressSearch" type="search" autocomplete="off"
               placeholder="Ex. 192 Notre-Dame">
        <button id="clearSearch" class="clear-btn" aria-label="Effacer">×</button>
      </div>
      <div id="searchStatus" class="search-status"></div>
      <div id="results" class="results"></div>
    </section>

    <section class="map-card">
      <div class="map-toolbar">
        <div>
          <strong>Carte opérationnelle</strong>
          <span id="hydrantCount">Chargement des bornes…</span>
        </div>
        <label class="toggle">
          <input id="hydrantToggle" type="checkbox" checked>
          <span>Bornes</span>
        </label>
      </div>
      <div id="map"></div>
    </section>

    <section class="quick-grid">
      <button class="quick-card" id="openSelectedBtn" disabled>
        <span class="quick-icon">➤</span>
        <strong>Départ GPS</strong>
        <small>Vers l’adresse choisie</small>
      </button>
      <button class="quick-card" id="nearestHydrantBtn" disabled>
        <span class="quick-icon">🚰</span>
        <strong>Borne la plus proche</strong>
        <small>Calcul automatique</small>
      </button>
    </section>

    <section id="selectedPanel" class="selected-panel hidden">
      <div>
        <span class="panel-label">INTERVENTION</span>
        <h2 id="selectedAddress"></h2>
        <p id="selectedCoords"></p>
      </div>
      <button id="startBtn" class="primary-btn">DÉPART</button>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="active">🗺️<span>Carte</span></button>
    <button id="navSearch">🔎<span>Recherche</span></button>
    <button id="navRefresh">↻<span>Actualiser</span></button>
  </nav>

  <div id="toast" class="toast hidden"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
